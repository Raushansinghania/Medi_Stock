version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medistock-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medistock
      MYSQL_USER: medistock_app
      MYSQL_PASSWORD: medistock_password
    volumes:
      - mysql-data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medistock-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=medistock_app
      - DB_PASSWORD=medistock_password
      - DB_NAME=medistock
      - JWT_SECRET=medistock_production_secret_key_change_me
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mysql

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medistock-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mysql-data:
    driver: local
